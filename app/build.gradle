plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saihgupr.btcontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.saihgupr.btcontrol"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.3.3"
    }


    signingConfigs {
        release {
            // Releases are signed with the standard debug key, same as previous
            // versions, so sideloaded updates install over each other.
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "AndroidTVBluetooth.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
}
